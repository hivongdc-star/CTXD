name: server-build

on:
  push:
    branches:
      - main
      - codex/kfgz-extended-combat
  pull_request:
    paths:
      - 'Server/**'
      - 'Database/**'
      - 'Data/**'
      - '.github/workflows/server-build.yml'

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Server/CTXD.Server/CTXD.Server.csproj --configuration Release --nologo
