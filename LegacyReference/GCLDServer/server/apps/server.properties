#礼品码中控服务器监听端口
gcld.gift.port = 8000
#礼品码中控服务器验证key
gcld.gift.key = 3t45soimkc4rg6u7u89uf


#聊天限制
#聊天历史最大条数 
gcld.chat.history.maxCount = 20
#聊天历史过期时间(分钟)
gcld.chat.history.expireTime = 10
#聊天内容最大重复次数 
